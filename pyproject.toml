[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bandabi"
version = "0.1.0"
description = "Bandabi shuttle simulation & experiment runner"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "networkx>=2.8",
]

[project.optional-dependencies]
road = [
  "osmnx>=1.9",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "scikit-learn>=1.2",
]
test = ["pytest>=8.0"]

[project.scripts]
bandabi-run = "bandabi.cli:main"

[tool.setuptools.packages.find]
include = ["bandabi*", "routing*"]
exclude = ["apps*", "configs*", "data*", "legacy*", "tests*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
addopts = "-q"
